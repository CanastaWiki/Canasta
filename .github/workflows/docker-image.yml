name: Docker build and push

# limit concurrency
# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#examples-using-concurrency-and-the-default-behavior
concurrency: docker-image-${{ github.ref }}

on:
  push:
    # Only activate for `master` branch
    branches:
      - master
      - 1.2.x

  # Plus for any pull-requests
  pull_request:

  workflow_dispatch:
    inputs:
      version:
        description: Existing Canasta version to attest (leave blank to rebuild)
        required: false
        type: string

jobs:
  # Lint both Dockerfiles with hadolint.
  lint:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      matrix:
        dockerfile: [Dockerfile, Dockerfile.canasta]
    steps:
      - uses: actions/checkout@v4
      -
        name: Run linter (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: "hadolint.yaml"

  # Build each platform on a runner of that architecture: first canasta-base
  # from the top-level Dockerfile, then canasta on top of the canasta-base this job just built.
  # Each image is pushed by digest; the push job below joins the digests into
  # one multi-platform tag per image.
  build:
    needs: [lint]
    if: always() && (needs.lint.result == 'success' || needs.lint.result == 'skipped') && (github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.version == ''))
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      # Fork PRs get a read-only token: build and scan, but publish nothing.
      CAN_PUBLISH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      -
        # Passed to the base build as APT_REFRESH so the apt-upgrade layer's
        # cache key changes daily and with each version; otherwise a rebuild
        # reuses a stale cached layer, and a release built after the day's
        # first build ships the packages that build cached.
        name: Set package refresh key
        id: refresh
        run: echo "APT_REFRESH=$(date +%Y%m%d)-$(cat VERSION)" >> "$GITHUB_OUTPUT"
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        if: env.CAN_PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push canasta-base by digest
        id: base_build
        if: env.CAN_PUBLISH == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/canastawiki/canasta-base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max
          build-args: |
            APT_REFRESH=${{ steps.refresh.outputs.APT_REFRESH }}
      -
        # Registries rate-limit pulls of the Debian base image with a 429 that
        # clears within a minute; the retry reuses the layers built so far.
        name: Wait before retrying the canasta-base build
        if: steps.base_build.outcome == 'failure'
        run: sleep 60
      -
        name: Retry build and push canasta-base by digest
        id: base_build_retry
        if: steps.base_build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/canastawiki/canasta-base,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          cache-to: type=gha,scope=base-${{ matrix.arch }},mode=max
          build-args: |
            APT_REFRESH=${{ steps.refresh.outputs.APT_REFRESH }}
      -
        name: Record canasta-base digest
        id: base_digest
        if: env.CAN_PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.base_build.outputs.digest || steps.base_build_retry.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests-canasta-base"
          touch "$RUNNER_TEMP/digests-canasta-base/${DIGEST#sha256:}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      -
        name: Build and push canasta by digest
        id: canasta_build
        if: env.CAN_PUBLISH == 'true'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.canasta
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/canastawiki/canasta,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=canasta-${{ matrix.arch }}
          cache-to: type=gha,scope=canasta-${{ matrix.arch }},mode=max
          build-args: |
            BASE_IMAGE=ghcr.io/canastawiki/canasta-base@${{ steps.base_digest.outputs.digest }}
      -
        name: Wait before retrying the canasta build
        if: steps.canasta_build.outcome == 'failure'
        run: sleep 60
      -
        name: Retry build and push canasta by digest
        id: canasta_build_retry
        if: steps.canasta_build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.canasta
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/canastawiki/canasta,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=canasta-${{ matrix.arch }}
          cache-to: type=gha,scope=canasta-${{ matrix.arch }},mode=max
          build-args: |
            BASE_IMAGE=ghcr.io/canastawiki/canasta-base@${{ steps.base_digest.outputs.digest }}
      -
        name: Record canasta digest
        id: canasta_digest
        if: env.CAN_PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.canasta_build.outputs.digest || steps.canasta_build_retry.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests-canasta"
          touch "$RUNNER_TEMP/digests-canasta/${DIGEST#sha256:}"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      -
        name: Upload canasta-base digest
        if: env.CAN_PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}-canasta-base
          path: ${{ runner.temp }}/digests-canasta-base/*
          if-no-files-found: error
          retention-days: 1
      -
        name: Upload canasta digest
        if: env.CAN_PUBLISH == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}-canasta
          path: ${{ runner.temp }}/digests-canasta/*
          if-no-files-found: error
          retention-days: 1
      -
        name: Build canasta-base locally for scanning
        id: base_scan_build
        if: env.CAN_PUBLISH != 'true'
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          build-args: |
            APT_REFRESH=${{ steps.refresh.outputs.APT_REFRESH }}
          tags: canasta-base:pr-scan
      -
        name: Wait before retrying the canasta-base scan build
        if: steps.base_scan_build.outcome == 'failure'
        run: sleep 60
      -
        name: Retry build canasta-base locally for scanning
        if: steps.base_scan_build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=base-${{ matrix.arch }}
          build-args: |
            APT_REFRESH=${{ steps.refresh.outputs.APT_REFRESH }}
          tags: canasta-base:pr-scan
      -
        name: Scan local canasta-base with Trivy
        if: env.CAN_PUBLISH != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: canasta-base:pr-scan
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      -
        # A fork PR can't push the canasta-base it built, and the builder can't
        # read images loaded into the local Docker daemon, so canasta builds on
        # the published canasta-base. Changes to canasta-base are covered by the
        # canasta-base scan above.
        name: Build canasta locally for scanning
        if: env.CAN_PUBLISH != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.canasta
          platforms: linux/${{ matrix.arch }}
          load: true
          cache-from: type=gha,scope=canasta-${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=ghcr.io/canastawiki/canasta-base:latest
          tags: canasta:pr-scan
      -
        name: Scan local canasta with Trivy
        if: env.CAN_PUBLISH != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: canasta:pr-scan
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          skip-setup-trivy: true
      -
        # Boots each image this job built, as `canasta create` would, before
        # the push job tags it.
        name: Smoke test canasta-base
        env:
          IMAGE: ${{ env.CAN_PUBLISH == 'true' && format('ghcr.io/canastawiki/canasta-base@{0}', steps.base_digest.outputs.digest) || 'canasta-base:pr-scan' }}
        run: .github/scripts/smoke-test.sh "$IMAGE"
      -
        name: Smoke test canasta
        env:
          IMAGE: ${{ env.CAN_PUBLISH == 'true' && format('ghcr.io/canastawiki/canasta@{0}', steps.canasta_digest.outputs.digest) || 'canasta:pr-scan' }}
        run: .github/scripts/smoke-test.sh "$IMAGE"

  # Push the images to GitHub Packages, one matrix leg per image. Both images
  # get the same tags:
  # for pull-requests: <MW_VERSION>-<DATE>-<PR_NUMBER>, eg: 1.43.1-20260224-25
  # for `master` branch: latest + <MW_MAJOR>-latest + <MW_VERSION>-latest + <MW_VERSION>-<DATE>-<SHA>
  #   (plus <CANASTA_VERSION> when VERSION file changes)
  # <MW_VERSION> being parsed from Dockerfile
  push:
    needs: [build]
    if: always() && needs.build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && inputs.version == ''))
    strategy:
      fail-fast: false
      matrix:
        include:
          # The canasta legs keep the code-scanning categories the canasta
          # image used before canasta-base was built here, so its existing
          # alerts stay matched.
          - image: canasta-base
            sarif_category: trivy-canasta-base-image
          - image: canasta
            sarif_category: trivy-container-image
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
      pull-requests: write
      security-events: write
    env:
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 (full history) so the "Generate tags" step can diff
          # the entire pushed range (github.event.before..HEAD) to detect a
          # VERSION-file change. A shallow clone leaves the push's base commit
          # unreachable, which silently suppresses the immutable Canasta version
          # tag when the bump is not the tip commit of a multi-commit push.
          fetch-depth: 0
      -
        name: Generate tags
        id: generate
        # docker manifest inspect handles the anonymous token dance itself, so
        # the registry-existence check below works without logging in.
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
          HEAD_REF: ${{ github.head_ref }}
        run: |

          # Image ID
          IMAGE_ID=ghcr.io/canastawiki/$IMAGE_NAME

          # Date
          BDATE=$(date +%Y%m%d)

          # Extract MW version from the MW_CORE_VERSION default in Dockerfile
          # (matches whether it is declared via ARG or ENV; ignores any prefix and trailing chars)
          MEDIAWIKI_VERSION=$(sed -nr 's/.*MW_CORE_VERSION=([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' Dockerfile | head -n1)
          # Extract MW major version (like 1.43)
          MEDIAWIKI_MAJOR_VERSION=${MEDIAWIKI_VERSION%.*}

          # Change all uppercase to lowercase, just in case
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          # Strip git ref prefix from version and use it as suffix for version
          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,')

          # Get the Canasta version from the "VERSION" file
          CANASTA_VERSION=$(cat VERSION)

          # For pull requests just extract the PR number
          PR_NUMBER=""
          [ "${{ github.event_name }}" == "pull_request" ] && VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\)/merge,\1,')
          [ "${{ github.event_name }}" == "pull_request" ] && PR_NUMBER=$VERSION

          # Append version
          [ "${{ github.event_name }}" == "pull_request" ] && VERSION=$MEDIAWIKI_VERSION-$BDATE-$VERSION

          # Use Docker `latest` tag convention if it's a master branch build
          [ "$VERSION" == "master" ] && VERSION=latest

          # Compose REGISTRY_TAGS variable
          REGISTRY_TAGS=$IMAGE_ID:$VERSION

          # For master branch also supply extra tags: <MW_MAJOR>-latest, <MW_VERSION>-latest, <MW_VERSION>-<DATE>-<SHA>
          [ "$VERSION" == "latest" ] && REGISTRY_TAGS=$REGISTRY_TAGS,$IMAGE_ID:$MEDIAWIKI_MAJOR_VERSION-latest,$IMAGE_ID:$MEDIAWIKI_VERSION-latest,$IMAGE_ID:$MEDIAWIKI_VERSION-$BDATE-$(git rev-parse --short HEAD)

          # Publish the immutable Canasta version tag (e.g., 3.6.0) only when
          # VERSION file changed anywhere in this push, so the tag is set once per
          # release even when the bump is not the tip commit of a multi-commit push.
          # Diff the whole pushed range (before..HEAD); fall back to HEAD~1 when the
          # base commit is the zero SHA (branch creation) or otherwise unreachable.
          BEFORE_SHA="${{ github.event.before }}"
          DIFF_BASE="HEAD~1"
          if [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$' && git cat-file -e "$BEFORE_SHA" 2>/dev/null; then
            DIFF_BASE="$BEFORE_SHA"
          fi
          IS_RELEASE=false
          if [ "$VERSION" == "latest" ] && git diff "$DIFF_BASE" HEAD --name-only | grep -q '^VERSION$'; then
            # The version tag is meant to be immutable. If it already exists in
            # the registry (e.g. this workflow was re-run, or a later master
            # push landed after the release), do not re-push it from a different
            # commit; warn instead so the mismatch is visible in the run log.
            if docker manifest inspect "$IMAGE_ID:$CANASTA_VERSION" >/dev/null 2>&1; then
              echo "::warning::Immutable tag $CANASTA_VERSION already exists in the registry; not re-pushing it from this commit."
            else
              REGISTRY_TAGS=$REGISTRY_TAGS,$IMAGE_ID:$CANASTA_VERSION
              IS_RELEASE=true
            fi
          fi

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION
          echo REGISTRY_TAGS=$REGISTRY_TAGS
          echo "headref=$HEAD_REF"

          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-8)
          [ "${{ github.event_name }}" == "pull_request" ] && SHA_SHORT=$(echo ${{ github.event.pull_request.head.sha }} | cut -c1-8)

          echo "Final image tag to be pushed:"
          echo $REGISTRY_TAGS
          echo "REGISTRY_TAGS=$REGISTRY_TAGS" >> $GITHUB_OUTPUT
          echo "REGISTRY_TAGS_VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "REGISTRY_TAGS_PR_NUMBER=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "CANASTA_VERSION=$CANASTA_VERSION" >> "$GITHUB_OUTPUT"
          echo "IS_RELEASE=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "SHA_SHORT=$SHA_SHORT" >> $GITHUB_OUTPUT
      -
        name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.image }}
          merge-multiple: true
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        # The per-platform pushes carry their provenance attestations, which the
        # joined index keeps alongside the platform images.
        name: Create multi-platform tags
        id: docker_build
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY_TAGS: ${{ steps.generate.outputs.REGISTRY_TAGS }}
        run: |
          IFS=',' read -ra TAGS <<< "$REGISTRY_TAGS"
          TAG_ARGS=()
          for TAG in "${TAGS[@]}"; do
            TAG_ARGS+=(-t "$TAG")
          done
          SOURCES=()
          for DIGEST in *; do
            SOURCES+=("ghcr.io/canastawiki/$IMAGE_NAME@sha256:$DIGEST")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "${SOURCES[@]}"
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${TAGS[0]}" | jq -er .digest)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      -
        name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }}
      -
        name: Image tags debug
        run: echo ${{ steps.generate.outputs.REGISTRY_TAGS }}
      -
        name: Resolve platform image digests
        id: platform_digests
        env:
          IMAGE_REF: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.docker_build.outputs.digest }}
        run: |
          MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE_REF")
          AMD64_DIGEST=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$MANIFEST")
          ARM64_DIGEST=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "$MANIFEST")
          echo "amd64=$AMD64_DIGEST" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64_DIGEST" >> "$GITHUB_OUTPUT"
      -
        name: Scan amd64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.platform_digests.outputs.amd64 }}
          format: sarif
          output: trivy-results-amd64.sarif
          ignore-unfixed: true
          limit-severities-for-sarif: true
          severity: CRITICAL,HIGH
      -
        name: Upload amd64 Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-results-amd64.sarif
          category: ${{ matrix.sarif_category }}-amd64
      -
        name: Scan arm64 image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.platform_digests.outputs.arm64 }}
          format: sarif
          output: trivy-results-arm64.sarif
          ignore-unfixed: true
          limit-severities-for-sarif: true
          severity: CRITICAL,HIGH
          skip-setup-trivy: true
      -
        name: Upload arm64 Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy-results-arm64.sarif
          category: ${{ matrix.sarif_category }}-arm64
      -
        name: Generate amd64 CycloneDX SBOM
        if: steps.generate.outputs.IS_RELEASE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.platform_digests.outputs.amd64 }}
          format: cyclonedx
          output: ${{ env.IMAGE_NAME }}-${{ steps.generate.outputs.CANASTA_VERSION }}-amd64.cdx.json
          skip-setup-trivy: true
      -
        name: Generate arm64 CycloneDX SBOM
        if: steps.generate.outputs.IS_RELEASE == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.platform_digests.outputs.arm64 }}
          format: cyclonedx
          output: ${{ env.IMAGE_NAME }}-${{ steps.generate.outputs.CANASTA_VERSION }}-arm64.cdx.json
          skip-setup-trivy: true
      -
        name: Attest amd64 release SBOM
        if: steps.generate.outputs.IS_RELEASE == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.platform_digests.outputs.amd64 }}
          sbom-path: ${{ env.IMAGE_NAME }}-${{ steps.generate.outputs.CANASTA_VERSION }}-amd64.cdx.json
          push-to-registry: true
      -
        name: Attest arm64 release SBOM
        if: steps.generate.outputs.IS_RELEASE == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.platform_digests.outputs.arm64 }}
          sbom-path: ${{ env.IMAGE_NAME }}-${{ steps.generate.outputs.CANASTA_VERSION }}-arm64.cdx.json
          push-to-registry: true

      -
        name: Notify about image tag
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: ${{ env.IMAGE_NAME }}-image-tag
          message: ":whale: The `${{ env.IMAGE_NAME }}` image based on [${{ steps.generate.outputs.SHA_SHORT }}](https://github.com/CanastaWiki/Canasta/pull/${{ steps.generate.outputs.REGISTRY_TAGS_PR_NUMBER }}/commits/${{ github.event.pull_request.head.sha }}) commit has been built with `${{ steps.generate.outputs.REGISTRY_TAGS_VERSION }}` tag as [${{ steps.generate.outputs.REGISTRY_TAGS }}](https://github.com/${{ github.repository }}/pkgs/container/${{ env.IMAGE_NAME }}?tag=${{ steps.generate.outputs.REGISTRY_TAGS_VERSION }})"

  recover-attestation:
    name: Recover release SBOM attestations
    if: github.event_name == 'workflow_dispatch' && inputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        image: [canasta-base, canasta]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    env:
      IMAGE_NAME: ${{ matrix.image }}
    steps:
      - name: Validate version
        id: recovery
        env:
          RECOVERY_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$RECOVERY_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must use the X.Y.Z format."
            exit 1
          fi
          echo "version=$RECOVERY_VERSION" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve published platform image digests
        id: platform_digests
        env:
          IMAGE_REF: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}:${{ steps.recovery.outputs.version }}
        run: |
          MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE_REF")
          AMD64_DIGEST=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' <<< "$MANIFEST")
          ARM64_DIGEST=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' <<< "$MANIFEST")
          echo "amd64=$AMD64_DIGEST" >> "$GITHUB_OUTPUT"
          echo "arm64=$ARM64_DIGEST" >> "$GITHUB_OUTPUT"
      - name: Generate amd64 CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.platform_digests.outputs.amd64 }}
          format: cyclonedx
          output: ${{ env.IMAGE_NAME }}-${{ steps.recovery.outputs.version }}-amd64.cdx.json
      - name: Generate arm64 CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}@${{ steps.platform_digests.outputs.arm64 }}
          format: cyclonedx
          output: ${{ env.IMAGE_NAME }}-${{ steps.recovery.outputs.version }}-arm64.cdx.json
          skip-setup-trivy: true
      - name: Attest amd64 release SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.platform_digests.outputs.amd64 }}
          sbom-path: ${{ env.IMAGE_NAME }}-${{ steps.recovery.outputs.version }}-amd64.cdx.json
          push-to-registry: true
      - name: Attest arm64 release SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/canastawiki/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.platform_digests.outputs.arm64 }}
          sbom-path: ${{ env.IMAGE_NAME }}-${{ steps.recovery.outputs.version }}-arm64.cdx.json
          push-to-registry: true
