name: Rescan published images

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: rescan-published-canasta-images
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  packages: read

env:
  IMAGE: ghcr.io/canastawiki/canasta
  ISSUE_LABEL: automated
  ISSUE_TITLE: Scheduled Canasta image vulnerability scan

jobs:
  scan:
    name: Scan published tags
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install regctl
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0

      - name: Determine current tags
        id: tags
        run: |
          BASE_IMAGE=$(awk -F'=' '/^ARG BASE_IMAGE=/ {print $2}' Dockerfile)
          MEDIAWIKI_VERSION=$(regctl image config "$BASE_IMAGE" | jq -r '.config.Labels["wiki.canasta.mediawiki.version"]')
          MEDIAWIKI_BRANCH=${MEDIAWIKI_VERSION%.*}
          CANASTA_VERSION=$(cat VERSION)

          if [[ ! "$MEDIAWIKI_BRANCH" =~ ^[0-9]+\.[0-9]+$ ]] ||
             [[ ! "$CANASTA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine valid published image tags."
            exit 1
          fi

          {
            echo "mediawiki=$MEDIAWIKI_BRANCH-latest"
            echo "version=$CANASTA_VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Login to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Set up Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Scan tags and prepare report
        id: scan
        env:
          MEDIAWIKI_TAG: ${{ steps.tags.outputs.mediawiki }}
          VERSION_TAG: ${{ steps.tags.outputs.version }}
        run: |
          RESULT_DIR="$RUNNER_TEMP/trivy-results"
          mkdir -p "$RESULT_DIR"
          SUMMARY="$RESULT_DIR/summary"
          FINDINGS="$RESULT_DIR/findings"
          : > "$SUMMARY"
          : > "$FINDINGS"
          SCANNED=0

          extract_extension_from_target() {
            local target="$1"
            if [[ "$target" =~ /extensions/([^/]+)/ ]]; then
              echo "${BASH_REMATCH[1]}"
              return 0
            fi
            return 1
          }

          build_extension_package_map() {
            local digest="$1"
            local key="${digest#sha256:}"
            local manifests="$RESULT_DIR/${key}-extension-manifests.tsv"
            local raw_map="$RESULT_DIR/${key}-extension-map-raw.tsv"
            local map="$RESULT_DIR/${key}-extension-map.tsv"

            [ -f "$map" ] && return

            docker run --rm --entrypoint sh "$IMAGE@$digest" -lc '
              set -eu
              for f in /var/www/mediawiki/w/extensions/*/composer.json /var/www/mediawiki/w/extensions/*/package.json; do
                [ -f "$f" ] || continue
                ext=$(basename "$(dirname "$f")")
                kind=$(basename "$f")
                printf "%s\t%s\t" "$ext" "$kind"
                base64 -w0 "$f"
                printf "\n"
              done
            ' > "$manifests"

            : > "$raw_map"
            while IFS=$'\t' read -r EXT KIND MANIFEST_B64; do
              [ -n "$EXT" ] || continue
              [ -n "$MANIFEST_B64" ] || continue
              MANIFEST_JSON=$(printf '%s' "$MANIFEST_B64" | base64 -d 2>/dev/null || true)
              [ -n "$MANIFEST_JSON" ] || continue

              if [ "$KIND" = "composer.json" ]; then
                printf '%s' "$MANIFEST_JSON" |
                  jq -r --arg ext "$EXT" '
                    (.require // {})
                    | keys[]
                    | select(. != "php")
                    | select(startswith("ext-") | not)
                    | "\(.)\t\($ext)"
                  ' >> "$raw_map"
              elif [ "$KIND" = "package.json" ]; then
                printf '%s' "$MANIFEST_JSON" |
                  jq -r --arg ext "$EXT" '
                    (.dependencies // {})
                    | keys[]
                    | "\(.)\t\($ext)"
                  ' >> "$raw_map"
              fi
            done < "$manifests"

            if [ -s "$raw_map" ]; then
              sort -u "$raw_map" | awk -F '\t' '
                {
                  if ($1 == "") {
                    next
                  }
                  if (owners[$1] == "") {
                    owners[$1] = $2
                  } else {
                    owners[$1] = owners[$1] "," $2
                  }
                }
                END {
                  for (pkg in owners) {
                    print pkg "\t" owners[pkg]
                  }
                }
              ' | sort > "$map"
            else
              : > "$map"
            fi
          }

          for TAG in latest "$MEDIAWIKI_TAG" "$VERSION_TAG"; do
            INSPECT_ERROR="$RESULT_DIR/inspect-error"
            if ! MANIFEST=$(docker buildx imagetools inspect --raw "$IMAGE:$TAG" 2> "$INSPECT_ERROR"); then
              cat "$INSPECT_ERROR" >&2
              if grep -Fqi 'manifest unknown' "$INSPECT_ERROR" ||
                 grep -Fqi "$IMAGE:${TAG}: not found" "$INSPECT_ERROR"; then
                echo "::warning::Skipping missing image tag $IMAGE:$TAG"
                continue
              fi
              echo "::error::Could not inspect image tag $IMAGE:$TAG"
              exit 1
            fi
            for ARCH in amd64 arm64; do
              DIGEST=$(jq -er --arg arch "$ARCH" \
                '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' \
                <<< "$MANIFEST")
              RESULT="$RESULT_DIR/${DIGEST#sha256:}.json"

              if [ ! -f "$RESULT" ]; then
                trivy image \
                  --image-src remote \
                  --format json \
                  --output "$RESULT" \
                  --ignore-unfixed \
                  --severity CRITICAL,HIGH \
                  "$IMAGE@$DIGEST"
              fi

              MAP_FILE="$RESULT_DIR/${DIGEST#sha256:}-extension-map.tsv"
              jq -r '
                [
                  .Results[]? as $result
                  | $result.Vulnerabilities[]?
                  | [
                      .Severity,
                      .VulnerabilityID,
                      .PkgName,
                      .InstalledVersion,
                      (.FixedVersion // ""),
                      ($result.Class // ""),
                      ($result.Target // "")
                    ]
                ]
                | sort_by(.[1], .[2], .[3], .[5], .[6])
                | unique
                | .[]
                | @tsv
              ' "$RESULT" |
                while IFS=$'\t' read -r SEVERITY VULNERABILITY PACKAGE INSTALLED FIXED CLASS TARGET; do
                  EXTENSION=""
                  if EXTENSION_FROM_TARGET=$(extract_extension_from_target "$TARGET"); then
                    EXTENSION="$EXTENSION_FROM_TARGET"
                  elif [ "$CLASS" = "lang-pkgs" ]; then
                    if [ ! -f "$MAP_FILE" ]; then
                      build_extension_package_map "$DIGEST"
                    fi
                    EXTENSION=$(awk -F '\t' -v package="$PACKAGE" '$1 == package { print $2; exit }' "$MAP_FILE")
                  elif [ "$CLASS" = "os-pkgs" ]; then
                    EXTENSION="base"
                  fi

                  printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                    "$DIGEST" "$ARCH" "$SEVERITY" "$VULNERABILITY" "$PACKAGE" "$INSTALLED" "$FIXED" "$EXTENSION"
                done >> "$FINDINGS"

              COUNT=$(jq '
                [.Results[]?.Vulnerabilities[]?.VulnerabilityID]
                | unique
                | length
              ' "$RESULT")
              SCANNED=$((SCANNED + 1))
              printf '| `%s` | `%s` | %s |\n' "$TAG" "$ARCH" "$COUNT" >> "$SUMMARY"
            done
          done

          if (( SCANNED == 0 )); then
            echo "::error::No published platform images were available to scan."
            exit 1
          fi

          TOTAL=$(cut -f4 "$FINDINGS" | sort -u | sed '/^$/d' | wc -l | tr -d ' ')
          REPORT="$RESULT_DIR/report.md"
          {
            echo "Trivy found **$TOTAL** distinct fixable HIGH/CRITICAL CVEs across the published images."
            echo
            echo "[View workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
            echo
            echo '| Tag | Platform | Distinct CVEs |'
            echo '| --- | --- | ---: |'
            cat "$SUMMARY"

            if (( TOTAL > 0 )); then
              echo
              echo '<details><summary>Unique findings (first 200)</summary>'
              echo
              echo '| Digest | Platform | Severity | Vulnerability | Package | Installed | Fixed | Extension |'
              echo '| --- | --- | --- | --- | --- | --- | --- | --- |'
              sort -u "$FINDINGS" | awk 'NR <= 200' |
                while IFS=$'\t' read -r DIGEST ARCH SEVERITY VULNERABILITY PACKAGE INSTALLED FIXED EXTENSION; do
                  printf '| `%s` | `%s` | %s | `%s` | `%s` | `%s` | `%s` | `%s` |\n' \
                    "$DIGEST" "$ARCH" "$SEVERITY" "$VULNERABILITY" "$PACKAGE" "$INSTALLED" "$FIXED" "$EXTENSION"
                done
              echo
              echo '</details>'
            fi
          } > "$REPORT"

          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "findings=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"

      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          REPORT: ${{ steps.scan.outputs.report }}
        run: |
          gh label create "$ISSUE_LABEL" \
            --color ededed \
            --description "Created and maintained by automation" \
            --force

          ISSUE_NUMBER=$(gh issue list \
            --state all \
            --label "$ISSUE_LABEL" \
            --limit 1000 \
            --json number,state,title |
            jq -r --arg title "$ISSUE_TITLE" \
              '[.[] | select(.title == $title)][0].number // empty')

          if (( FINDINGS > 0 )); then
            if [ -n "$ISSUE_NUMBER" ]; then
              gh issue reopen "$ISSUE_NUMBER" 2>/dev/null || true
              gh issue edit "$ISSUE_NUMBER" --add-label "$ISSUE_LABEL" --body-file "$REPORT"
            else
              gh issue create --label "$ISSUE_LABEL" --title "$ISSUE_TITLE" --body-file "$REPORT"
            fi
          elif [ -n "$ISSUE_NUMBER" ]; then
            gh issue edit "$ISSUE_NUMBER" --add-label "$ISSUE_LABEL"
            STATE=$(gh issue view "$ISSUE_NUMBER" --json state --jq '.state')
            if [ "$STATE" = "OPEN" ]; then
              gh issue close "$ISSUE_NUMBER" \
                --comment "The latest scheduled scan found no fixable HIGH/CRITICAL vulnerabilities."
            fi
          fi
